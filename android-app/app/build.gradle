plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def appPackageName  = project.findProperty('APP_PACKAGE_NAME') ?: 'com.foleyit.foleytimepro'
def appName         = project.findProperty('APP_NAME')         ?: 'FoleyTimePro'
def versionCodeVal  = (project.findProperty('VERSION_CODE')    ?: '3').toInteger()
def versionNameVal  = project.findProperty('VERSION_NAME')     ?: '3.0.0'

android {
    namespace appPackageName
    compileSdk 34

    defaultConfig {
        applicationId  appPackageName
        minSdk         24
        targetSdk      34
        versionCode    versionCodeVal
        versionName    versionNameVal
        manifestPlaceholders = [appName: appName]
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix  '-debug'
            debuggable true
        }
        release {
            minifyEnabled    true
            shrinkResources  true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.7'
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Compose BOM — pins all compose versions together
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Activity + Navigation
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def appPackageName  = project.findProperty('APP_PACKAGE_NAME') ?: 'com.foleyit.foleytimepro'
def appName         = project.findProperty('APP_NAME')         ?: 'FoleyTimePro'
def versionCodeVal  = (project.findProperty('VERSION_CODE')    ?: '2').toInteger()
def versionNameVal  = project.findProperty('VERSION_NAME')     ?: '2.0.0'

android {
    namespace appPackageName
    compileSdk 34

    defaultConfig {
        applicationId  appPackageName
        minSdk         24
        targetSdk      34
        versionCode    versionCodeVal
        versionName    versionNameVal
        manifestPlaceholders = [appName: appName]
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix  '-debug'
            debuggable true
        }
        release {
            minifyEnabled    true
            shrinkResources  true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
}

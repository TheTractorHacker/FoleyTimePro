org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
ksp.incremental=true

APP_PACKAGE_NAME=com.foleyit.foleytimepro
APP_NAME=FoleyTimePro
VERSION_CODE=4
VERSION_NAME=4.0.0

# ---- Firebase Cloud Messaging ----
# Set to true and place google-services.json in app/ to enable push.
APP_ENABLE_FIREBASE=false

# ---- Networking defaults (leave blank in dev; populate in release) ----
API_BASE_URL_DEFAULT=
CERT_PIN_PRIMARY=
CERT_PIN_BACKUP=

# ---- Release signing (values live in ~/.gradle/gradle.properties, NEVER here) ----
# FOLEY_KEYSTORE_PATH=/absolute/path/to/keystore.jks
# FOLEY_KEYSTORE_PASS=...
# FOLEY_KEY_ALIAS=...
# FOLEY_KEY_PASS=...

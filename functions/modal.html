<!-- ── Main clock modal ─────────────────────────────────── -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <button id="modalClose" class="close" aria-label="Close">&times;</button>

    <div id="modalBody">
      <h3 id="employeeName"></h3>

      <!-- Hidden GPS + employee fields -->
      <input type="hidden" id="modalEmployeeID">
      <input type="hidden" id="latitude">
      <input type="hidden" id="longitude">
      <input type="hidden" id="accuracy">
      <input type="hidden" id="ip_address">

      <!-- Step 1: PIN entry -->
      <form id="pinForm">
        <div class="modal-pin-label">Enter your PIN to continue</div>
        <input
          type="password"
          id="modalPIN"
          name="PIN"
          class="modal-pin-input"
          inputmode="numeric"
          autocomplete="off"
          placeholder="••••"
          maxlength="20"
          required>
        <button type="submit" class="modal-submit-btn">Verify PIN</button>
      </form>

      <!-- Step 2: Action selection (shown after PIN verified) -->
      <div id="statusArea" class="hidden">
        <div id="currentStatus" class="modal-current-status"></div>
        <textarea id="note" class="modal-note" placeholder="Optional note…"></textarea>
        <div class="action-grid">
          <div class="col">
            <button class="clockin"    onclick="submitAction('clockin')">Clock In</button>
            <button class="clockout"   onclick="submitAction('clockout')">Clock Out</button>
          </div>
          <div class="col">
            <button class="lunchstart" onclick="submitAction('lunchstart')">Lunch Start</button>
            <button class="lunchend"   onclick="submitAction('lunchend')">Lunch End</button>
          </div>
        </div>
      </div>

      <p id="modalError" class="error"></p>
    </div>
  </div>
</div>

<!-- ── Confirm time popup ───────────────────────────────── -->
<div id="confirmPopup" class="modal hidden">
  <div class="modal-content" style="max-width:320px;text-align:center">
    <h3 style="margin-bottom:6px">Confirm Time</h3>
    <p style="color:#6b7280;font-size:13px;margin-bottom:20px">Submit this punch at the current time, or adjust it manually.</p>
    <div class="confirm-time-display" id="confirmTimeText"></div>
    <input type="hidden" id="confirmAction">
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px">
      <button class="modal-submit-btn" onclick="confirmSubmit()">Submit Now</button>
      <button class="modal-secondary-btn" onclick="openAdjuster()">Adjust Time</button>
    </div>
  </div>
</div>

<!-- ── Clock-out confirmation ───────────────────────────── -->
<div id="confirmationPopup" class="popup hidden">
  <div class="popup-content">
    <div style="font-size:36px;margin-bottom:12px">🕐</div>
    <p id="confirmationMessage" style="font-size:15px;font-weight:600;margin-bottom:20px"></p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button id="confirmNo"  class="popup-btn popup-btn-cancel">Cancel</button>
      <button id="confirmYes" class="popup-btn popup-btn-confirm">Yes, Clock Out</button>
    </div>
  </div>
</div>

<!-- ── Adjust time popup ────────────────────────────────── -->
<div id="adjustPopup" class="modal hidden">
  <div class="modal-content" style="max-width:320px;text-align:center">
    <h3 style="margin-bottom:6px">Adjust Time</h3>
    <p style="color:#6b7280;font-size:13px;margin-bottom:20px">Enter the correct time for this punch.</p>
    <input
      type="text"
      id="adjustTimeInput"
      class="modal-pin-input"
      placeholder="e.g. 09:30 AM"
      style="text-align:center;font-size:22px;letter-spacing:.05em">
    <button class="modal-submit-btn" style="margin-top:14px" onclick="submitWithAdjustment()">Submit Adjusted Time</button>
  </div>
</div>

<!-- ── Feedback popup ───────────────────────────────────── -->
<div id="customPopup" class="popup hidden">
  <div class="popup-content">
    <p id="popupMessage" style="font-size:15px;margin-bottom:20px"></p>
    <button id="popupClose" class="popup-btn popup-btn-confirm">OK</button>
  </div>
</div>

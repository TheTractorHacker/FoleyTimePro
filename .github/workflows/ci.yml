name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 11 * * 1'   # weekly audit, catches new advisories without a code change

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli, gd, zip, curl, xml, mbstring
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Syntax check (php -l)
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 sh -c 'php -l "$0" >/dev/null || { echo "FAIL: $0"; exit 255; }'

      - name: Composer audit
        run: composer audit

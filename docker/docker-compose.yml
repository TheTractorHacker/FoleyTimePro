# FoleyTimePro — simple single-server deployment
# Expects an existing MySQL/MariaDB instance (on the host or elsewhere).
# Copy .env.example to .env and fill in your DB credentials, then:
#   docker compose up -d

services:
  app:
    image: foleyit/foleytimepro:latest
    container_name: foleytimepro
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME:-timeclock}
      DB_USER: ${DB_USER:-timeclock}
      DB_PASS: ${DB_PASS}
      DB_TIMEZONE: ${DB_TIMEZONE:-America/Chicago}
    ports:
      - "8080:80"
    volumes:
      - app_logs:/var/www/html/logs
      - app_uploads:/var/www/html/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app_logs:
  app_uploads:

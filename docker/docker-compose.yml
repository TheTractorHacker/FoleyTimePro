# FoleyTimePro — single company deploy (app + MariaDB)
# Copy .env.example to .env, fill in values, then:
#   docker compose up -d
#
# To deploy a second company on the same host, copy the folder,
# set a unique COMPANY name and APP_PORT in the .env, then:
#   docker compose -p acme up -d

services:

  db:
    image: mariadb:11
    container_name: ${COMPANY:-timeclock}_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-timeclock}
      MYSQL_USER: ${DB_USER:-timeclock}
      MYSQL_PASSWORD: ${DB_PASS}
      TZ: ${DB_TIMEZONE:-America/Chicago}
    volumes:
      - db_data:/var/lib/mysql
      - ../Install/timeclock-schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: bfoley23/foleytimepro:latest
    container_name: ${COMPANY:-timeclock}_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-timeclock}
      DB_USER: ${DB_USER:-timeclock}
      DB_PASS: ${DB_PASS}
      DB_TIMEZONE: ${DB_TIMEZONE:-America/Chicago}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - app_logs:/var/www/html/logs
      - app_uploads:/var/www/html/uploads
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  app_logs:
  app_uploads:

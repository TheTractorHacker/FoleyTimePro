upstream php-fpm {
    server 127.0.0.1:9000;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html;

    index index.php index.html;

    # Trust Cloudflare IP ranges for real visitor IPs
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/12;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Trust Docker bridge networks
    set_real_ip_from 172.16.0.0/12;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # API v1 — rewrite pretty URLs to PHP files (mirrors api/.htaccess)
    location ~ ^/api/v1/auth/(.+)$          { rewrite ^ /api/v1/auth.php?action=$1      last; }
    location ~ ^/api/v1/clock/(.+)$         { rewrite ^ /api/v1/clock.php?action=$1     last; }
    location ~ ^/api/v1/punch/(.+)$         { rewrite ^ /api/v1/punch.php?action=$1     last; }
    location ~ ^/api/v1/shifts/my$          { rewrite ^ /api/v1/shifts.php?action=my    last; }
    location ~ ^/api/v1/shifts$             { rewrite ^ /api/v1/shifts.php?action=list  last; }
    location ~ ^/api/v1/branding$           { rewrite ^ /api/v1/branding.php            last; }
    location ~ ^/api/v1/user/(.+)$          { rewrite ^ /api/v1/user.php?action=$1      last; }
    location ~ ^/api/v1/timeoff/(.+)$       { rewrite ^ /api/v1/timeoff.php?action=$1   last; }
    location ~ ^/api/v1/timeoff$            { rewrite ^ /api/v1/timeoff.php?action=timeoff last; }
    location ~ ^/api/v1/notifications/(.+)$ { rewrite ^ /api/v1/notifications.php?action=$1 last; }

    # Serve files or fall through to PHP
    location / {
        try_files $uri $uri/ $uri.php$is_args$args /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }

    # Block direct access to auth/db files
    location ~ ^/auth/ {
        deny all;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    client_max_body_size 20M;
}
